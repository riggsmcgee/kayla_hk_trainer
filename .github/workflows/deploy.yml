# CI + GitHub Pages deploy for Kayla's Hollow Knight Dojo.
#
# Every push to main and every pull request runs the "check" job
# (typecheck, tests, build). Only pushes to main go on to publish
# the web build to GitHub Pages.

name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Pages serves from https://<user>.github.io/<repo>/ — derive the
          # base path from the actual repo name so a rename can't 404 the
          # assets (the repo is kayla_hk_trainer, underscores and all).
          VITE_BASE: /${{ github.event.repository.name }}/

      # Pages artifact is only produced when this run will deploy.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Runs here (not in check) because enablement needs this job's
      # pages: write permission to auto-enable Pages on a fresh repo.
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
